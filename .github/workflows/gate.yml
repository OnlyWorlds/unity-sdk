# The SDK's EditMode suite on a Linux runner, started by hand (Actions tab, "gate", Run workflow).
# It needs three repository secrets: UNITY_LICENSE (the contents of a Unity Personal .ulf file),
# UNITY_EMAIL and UNITY_PASSWORD (https://game.ci/docs/github/activation/).
# Tests that need a fixture or world outside this repo (OW_CONFORMANCE_FIXTURE, OW_SIKELIA_WORLD, OW_WORLD_FOLDER)
# skip here, as do the live test and the Windows path-limit tests: 24 skipped of 1078 on its first run.
name: gate

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # the test runner posts its results as a check on the commit

jobs:
  editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/**', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.0f1
          testMode: editmode
          artifactsPath: test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 7
